# Project-wide Gradle settings.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enable KSP and Kapt improvements
kapt.use.worker.api=true
kapt.incremental.apt=true

# 抑制编译 SDK 版本警告（AGP 7.4.2 支持到 33，但使用 34）
android.suppressUnsupportedCompileSdk=34

# 固定 Gradle 使用 Android Studio 自带 JDK，避免系统 JDK 25 与当前 Kotlin 版本不兼容
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# 强制使用本机 Android SDK 中的 aapt2，规避 AGP 内置 aapt2 在当前 Windows 环境启动失败
android.aapt2FromMavenOverride=C\:\\Users\\ASUS\\AppData\\Local\\Android\\Sdk\\build-tools\\35.0.0\\aapt2.exe
